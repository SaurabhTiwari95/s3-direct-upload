[project]
name = "s3-direct-upload"
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=app --cov-report=term-missing"
markers = ["slow: starts local servers (moto S3 + uvicorn); deselect with -m \"not slow\""]

[tool.coverage.run]
branch = true

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["B008"] # FastAPI's Depends() in defaults is the intended pattern

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
"scripts/*" = ["S101", "S106"] # dummy credentials for the local S3 mock
"app/db.py" = ["S608"] # the only f-string part is the constant column list; values are always ? parameters
